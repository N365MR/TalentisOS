<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'" />
    <title>TalentisOS — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f5f7fa;
        color: #172b3a;
        font:
          16px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      span {
        display: grid;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        place-items: center;
        border-radius: 0.75rem;
        background: #1e3f54;
        color: #fff;
        font-weight: 800;
      }
      h1 {
        letter-spacing: -0.04em;
      }
      p {
        color: #667887;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">T</span>
      <h1>You’re offline.</h1>
      <p>The TalentisOS shell is still available. Reconnect to load the latest version.</p>
    </main>
  </body>
</html>
